<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <div class="controls">
      <input id="taskInput" type="text" placeholder="Add a new task..." aria-label="New task" />
      <button id="addButton" type="button">Add</button>
    </div>
    <ul id="taskList" class="task-list"></ul>
    <div class="footer">
      <span id="taskCount">0 tasks</span>
      <button id="clearButton" class="secondary" type="button">Clear All</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'todoListTasks';
    const taskInput = document.getElementById('taskInput');
    const addButton = document.getElementById('addButton');
    const clearButton = document.getElementById('clearButton');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');

    let tasks = [];

    function loadTasks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      tasks = stored ? JSON.parse(stored) : [];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateCount() {
      const count = tasks.length;
      taskCount.textContent = count === 1 ? '1 task' : `${count} tasks`;
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (!tasks.length) {
        taskList.innerHTML = '<li class="empty-state">No tasks yet. Add one to get started.</li>';
        updateCount();
        return;
      }

      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        item.className = `task-item${task.done ? ' done' : ''}`;

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = task.text;

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const toggleButton = document.createElement('button');
        toggleButton.textContent = task.done ? 'Undo' : 'Done';
        toggleButton.type = 'button';
        toggleButton.addEventListener('click', () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          renderTasks();
        });

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.type = 'button';
        removeButton.className = 'secondary';
        removeButton.addEventListener('click', () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        actions.append(toggleButton, removeButton);
        item.append(text, actions);
        taskList.appendChild(item);
      });

      updateCount();
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      taskInput.value = '';
      saveTasks();
      renderTasks();
      taskInput.focus();
    }

    addButton.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    clearButton.addEventListener('click', () => {
      tasks = [];
      saveTasks();
      renderTasks();
    });

    loadTasks();
    renderTasks();
  </script>
</body>
</html>
