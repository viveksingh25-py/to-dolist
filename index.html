<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .app {
      width: min(540px, 90vw);
      padding: 24px;
      background: #fff;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      border-radius: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.85rem;
      text-align: center;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d8dde7;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    button {
      border: none;
      background: #3b82f6;
      color: #fff;
      padding: 14px 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border: 1px solid #e5e9f2;
      border-radius: 14px;
      background: #f9fbff;
    }

    .task-item.done .text {
      text-decoration: line-through;
      opacity: 0.65;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .text {
      flex: 1;
      margin-right: 12px;
      word-break: break-word;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .footer {
      margin-top: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #555;
      flex-wrap: wrap;
      gap: 12px;
    }

    .empty-state {
      text-align: center;
      color: #555;
      padding: 28px 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>To-Do List</h1>
    <div class="controls">
      <input id="taskInput" type="text" placeholder="Add a new task..." aria-label="New task" />
      <button id="addButton" type="button">Add</button>
    </div>
    <ul id="taskList" class="task-list"></ul>
    <div class="footer">
      <span id="taskCount">0 tasks</span>
      <button id="clearButton" class="secondary" type="button">Clear All</button>
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'todoListTasks';
    const taskInput = document.getElementById('taskInput');
    const addButton = document.getElementById('addButton');
    const clearButton = document.getElementById('clearButton');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');

    let tasks = [];

    function loadTasks() {
      const stored = localStorage.getItem(STORAGE_KEY);
      tasks = stored ? JSON.parse(stored) : [];
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function updateCount() {
      const count = tasks.length;
      taskCount.textContent = count === 1 ? '1 task' : `${count} tasks`;
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (!tasks.length) {
        taskList.innerHTML = '<li class="empty-state">No tasks yet. Add one to get started.</li>';
        updateCount();
        return;
      }

      tasks.forEach((task, index) => {
        const item = document.createElement('li');
        item.className = `task-item${task.done ? ' done' : ''}`;

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = task.text;

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const toggleButton = document.createElement('button');
        toggleButton.textContent = task.done ? 'Undo' : 'Done';
        toggleButton.type = 'button';
        toggleButton.addEventListener('click', () => {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          renderTasks();
        });

        const removeButton = document.createElement('button');
        removeButton.textContent = 'Remove';
        removeButton.type = 'button';
        removeButton.className = 'secondary';
        removeButton.addEventListener('click', () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        actions.append(toggleButton, removeButton);
        item.append(text, actions);
        taskList.appendChild(item);
      });

      updateCount();
    }

    function addTask() {
      const text = taskInput.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      taskInput.value = '';
      saveTasks();
      renderTasks();
      taskInput.focus();
    }

    addButton.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        addTask();
      }
    });

    clearButton.addEventListener('click', () => {
      tasks = [];
      saveTasks();
      renderTasks();
    });

    loadTasks();
    renderTasks();
  </script>
</body>
</html>
